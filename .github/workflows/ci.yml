name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PostgreSQL event log's tests run against a real server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moondial
          POSTGRES_PASSWORD: moondial
          POSTGRES_DB: moondial_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moondial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOONDIAL_TEST_PG: postgres://moondial:moondial@localhost:5432/moondial_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml pytest
      - run: python -m pytest clear/tests -q
      - name: The Rust port's oracle corpus is current
        run: cd clear && python tools/make_oracle.py --check
