name: Deploy site (agentscanplay.com, moondial.ai)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "clear/**"
      - "crates/moondial-clear/**"
      - "crates/moondial-clear-wasm/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  # The Glass Gate as CI: the invitation on the site must pass its own checker, and the
  # page must show exactly the text that is served. A failing invitation never deploys.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Invitation passes CLEAR v0.3
        run: python ../clear/clear_check.py sites/agentscanplay/invitation.txt --vocab ../clear/vocab/disremembered.yaml
      - name: Site is consistent
        run: python tools/check_site.py
      - name: Published CLEAR files match the reference under clear/
        run: |
          cmp ../clear/clear_check.py sites/agentscanplay/clear/clear_check.py
          cmp ../clear/vocab/base.yaml sites/agentscanplay/clear/base.yaml
          cmp ../clear/vocab/disremembered.yaml sites/agentscanplay/clear/disremembered.yaml
          cmp ../clear/clear-spec-v0.3.md sites/agentscanplay/clear/clear-spec-v0.3.md

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'starsailor' }}
      APP_DIR: /srv/agentscanplay
    steps:
      - uses: actions/checkout@v4

      # The checker the play page runs: moondial-clear compiled to WebAssembly, so the
      # composer checks a message with the rules the Gate applies, in the browser.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the checker for the browser
        working-directory: .
        run: |
          cargo build -p moondial-clear-wasm --profile wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --no-typescript --out-dir site/sites/agentscanplay/play/clear \
            target/wasm32-unknown-unknown/wasm/moondial_clear_wasm.wasm
          ls -la site/sites/agentscanplay/play/clear

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" | tr -d '\r' | grep -v '^#' > ~/.ssh/known_hosts
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n ')
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Check secrets and connection
        run: |
          fail=0
          [ -n "$VPS_HOST" ] || { echo "::error::VPS_HOST secret is empty"; fail=1; }
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN .*PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY does not look like a private key (first line should be -----BEGIN OPENSSH PRIVATE KEY-----)"; fail=1; }
          shape() { printf '%s' "$1" | sed 's/[A-Za-z]/a/g; s/[0-9]/d/g'; }
          echo "::notice::VPS_HOST shape: $(shape "$VPS_HOST") (${#VPS_HOST} chars)"
          while read -r host type rest; do
            echo "::notice::known_hosts line: host shape $(shape "$host"), key type $type, key length ${#rest}"
          done < ~/.ssh/known_hosts
          grep -q "^$VPS_HOST " ~/.ssh/known_hosts \
            || { echo "::error::VPS_KNOWN_HOSTS has no line whose first field equals VPS_HOST exactly (compare the shapes above: both must be the same IP)"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 vps 'echo "connected as $(id -un)@$(hostname)"'; then
            echo "::error::ssh to $VPS_USER@$VPS_HOST failed; verbose trace follows"
            ssh -vvv -o BatchMode=yes -o ConnectTimeout=15 vps true 2>&1 | grep -iE "debug1: (Connecting|Authentications|Offering|Server accepts|Trying|Host key|read_passphrase)|Permission denied|Host key verification|Connection (timed out|refused|closed)|No route|identity file" | tail -20
            exit 1
          fi

      - name: Upload release
        run: |
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          ssh vps "mkdir -p $APP_DIR/releases/$REL"
          rsync -az --exclude '__pycache__/' sites deploy analytics "vps:$APP_DIR/releases/$REL/"

      - name: Switch, health-check, prune
        run: ssh vps "bash -s -- $REL" < deploy/remote-deploy.sh
