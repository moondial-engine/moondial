[workspace]
resolver = "2"
members = [
    "crates/moondial-time",
    "crates/moondial-log",
    "crates/moondial-store",
    "crates/moondial-registry",
    "crates/moondial-query",
    "crates/moondial-clear",
    "crates/moondial-driver",
    "crates/moondial",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/moondial-engine/moondial"
homepage = "https://moondial.ai"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
