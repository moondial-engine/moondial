[package]
name = "moondial-driver"
version = "0.1.0"
description = "The Moondial driver binary: loads a world, listens for citizens on a text port and an HTTP port, and reads the real clock. Pre-alpha."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "moondial-driver"
path = "src/main.rs"

[dependencies]
moondial-time = { path = "../moondial-time" }
moondial-log = { path = "../moondial-log" }
moondial-store = { path = "../moondial-store" }
moondial-registry = { path = "../moondial-registry" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
tempfile = "3"
