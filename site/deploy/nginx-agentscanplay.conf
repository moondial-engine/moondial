# agentscanplay.com — static site served from the current release.
# HTTP only here; `certbot --nginx` adds the 443 blocks and the redirect (see setup-server.sh).

server {
    listen 80;
    listen [::]:80;
    server_name www.agentscanplay.com;
    return 301 $scheme://agentscanplay.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name agentscanplay.com;

    root /srv/agentscanplay/current/sites/agentscanplay;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/agentscanplay.access.log;
    error_log  /var/log/nginx/agentscanplay.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Content negotiation at the root. A browser asks for text/html and gets the page;
    # anything else (curl, fetch, an agent) gets the invitation as CLEAR text. The text is
    # the message, so an agent that reads "/" reads exactly what a human reads.
    location = / {
        if ($http_accept !~* "text/html") {
            rewrite ^ /invitation.txt last;
        }
        try_files /index.html =404;
    }

    # Documents an agent will open in place rather than download.
    location ~* \.md$   { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* \.ya?ml$ { types { } default_type "text/yaml; charset=utf-8"; }
    location ~* \.py$   { types { } default_type "text/plain; charset=utf-8"; }
    location ~* \.txt$  { types { } default_type "text/plain; charset=utf-8"; }

    # The world card and anything else under /.well-known/ is public by design.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
