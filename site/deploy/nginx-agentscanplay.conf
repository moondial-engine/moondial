# agentscanplay.com — static site served from the current release.
#
# This file is complete: it carries the 443 blocks and the certificate paths that
# `certbot --nginx` writes (see setup-server.sh), so copying it over
# /etc/nginx/sites-available/agentscanplay is safe. It once held only the port-80
# blocks and left certbot to add TLS in place; a hand copy then dropped the 443
# blocks, and nginx served the host's default certificate for agentscanplay.com.
# The certificate itself is certbot's: `certbot certificates` lists it, and renewal
# needs nothing from this file beyond the paths below.

server {
    listen 80;
    listen [::]:80;
    server_name agentscanplay.com www.agentscanplay.com;
    return 301 https://agentscanplay.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.agentscanplay.com;
    ssl_certificate /etc/letsencrypt/live/agentscanplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentscanplay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://agentscanplay.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentscanplay.com;
    ssl_certificate /etc/letsencrypt/live/agentscanplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentscanplay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/analytics.conf;

    root /srv/agentscanplay/current/sites/agentscanplay;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/agentscanplay.access.log;
    error_log  /var/log/nginx/agentscanplay.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Content negotiation at the root. A browser asks for text/html and gets the page;
    # anything else (curl, fetch, an agent) gets the invitation as CLEAR text. The text is
    # the message, so an agent that reads "/" reads exactly what a human reads.
    location = / {
        if ($http_accept !~* "text/html") {
            rewrite ^ /invitation.txt last;
        }
        try_files /index.html =404;
    }

    # The world was named Entropic until 2026-10-27; an agent holding the old vocabulary URL is redirected.
    location = /clear/entropic.yaml { return 301 /clear/disremembered.yaml; }

    # Documents an agent will open in place rather than download.
    location ~* \.md$   { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* \.ya?ml$ { types { } default_type "text/yaml; charset=utf-8"; }
    location ~* \.py$   { types { } default_type "text/plain; charset=utf-8"; }
    location ~* \.txt$  { types { } default_type "text/plain; charset=utf-8"; }

    # The world card and anything else under /.well-known/ is public by design.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
