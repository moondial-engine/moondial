# moondial.ai — static site served from the current release.
# HTTP only here; `certbot --nginx` adds the 443 blocks and the redirect (see setup-server.sh).

server {
    listen 80;
    listen [::]:80;
    server_name www.moondial.ai;
    return 301 $scheme://moondial.ai$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name moondial.ai;

    root /srv/agentscanplay/current/sites/moondial;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/moondial.access.log;
    error_log  /var/log/nginx/moondial.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~* \.md$   { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* \.txt$  { types { } default_type "text/plain; charset=utf-8"; }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
