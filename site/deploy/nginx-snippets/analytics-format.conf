# Goes in /etc/nginx/conf.d/ (http context): the JSON log format the analytics snippet uses.
log_format analytics escape=json
  '{"ts":"$time_iso8601","host":"$host","method":"$request_method","path":"$uri",'
  '"query":"$args","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"ip":"$remote_addr","ua":"$http_user_agent","accept":"$http_accept",'
  '"referer":"$http_referer","scheme":"$scheme","proto":"$server_protocol"}';
