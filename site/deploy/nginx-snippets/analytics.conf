# Included inside each public server block. Writes one JSON line per request to the
# analytics log that site/analytics/collect.py reads. Raw IPs live only here, and
# logrotate removes them after 30 days; the analytics store keeps a daily-salted hash.

access_log /var/log/nginx/analytics.jsonl analytics;

# Interim admin surface until the engine's admin tool exists: the rendered report,
# behind basic auth. Written by site/analytics/render.py on a timer.
location ^~ /_admin/ {
    alias /srv/agentscanplay/shared/analytics/html/;
    index index.html;
    auth_basic "Moondial admin";
    auth_basic_user_file /etc/nginx/.htpasswd-moondial;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
}
