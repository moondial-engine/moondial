# Goes in /etc/nginx/sites-available/00-default and is enabled first. A request for a
# host this server has no block for (the bare address, a domain pointed here by
# mistake, an old name) gets the connection closed instead of whichever site block
# happens to be first in the file list. Without this, nginx picks the first server
# block as the default, which is how agentscanplay.com once answered with another
# site's certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    # Any certificate will do; the connection is closed before it matters. Point these
    # at one the box already has.
    ssl_certificate /etc/letsencrypt/live/agentscanplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentscanplay.com/privkey.pem;
    return 444;
}
