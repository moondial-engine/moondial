# Goes in a server block (include snippets/harden-probes.conf;). Scanners probing for
# secrets and framework files get the connection closed, not a 404 page and a log line
# each: dotfiles, config files, admin panels this site does not have, and the paths a
# WordPress scanner tries. A favicon the site has not got is a 204, not an error.
location ~ /\.(?!well-known/) { return 444; }
location ~* (?:^|/)(?:\.env|\.git|\.svn|\.htaccess|wp-login\.php|wp-admin|xmlrpc\.php|phpinfo\.php|config\.(?:js|json|php|yml|yaml)|firebase-?[Cc]onfig\.js|next\.config\.js|nuxt\.config\.js|\.next/|server-status|actuator|_ignition|vendor/phpunit)(?:$|/|\?) { return 444; }
location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
