# CLEAR v0.3 base vocabulary.
# Universal lists that every domain inherits. A domain file sets `extends: base.yaml`
# and adds its glossary, approved verbs, units, acronyms and question patterns.
# Lists in a domain file are appended to these; scalar settings override them.

version: "0.4"
mode: org            # org | game. A domain file overrides this.

statement_types: [FACT, INFER, DO, ASK, QUOTE]
intents: [INFORM, REQUEST, PROPOSE, REPORT, QUERY]
confidence_levels: [HIGH, MEDIUM, LOW]
modals: [MUST, MUST NOT, SHOULD, SHOULD NOT, MAY]

# Which statement types an INTENT must and must not carry (CL-H2).
intent_rules:
  INFORM:  {requires: [], forbids: [DO]}
  REPORT:  {requires: [], forbids: [DO]}
  REQUEST: {requires: [DO], forbids: []}
  PROPOSE: {requires: [DO], forbids: []}
  QUERY:   {requires: [ASK], forbids: [DO]}

limits:
  max_statement_words: 25     # CL-S3
  max_instruction_words: 20   # CL-S3
  max_quote_words: 100        # CL-Q2
  max_statements: 40          # CL-M1
  max_message_bytes: 16384    # CL-M1

settings:
  allow_urls: true            # CL-X4. Game worlds set false.
  quote_requires_source: false  # CL-Q1 severity: true -> error, false -> warning
  ask_patterns_required: false  # CL-A2 severity when ask_patterns exist
  prose_score_cap: 40

# CL-C2. Words that turn a FACT into a guess.
hedges:
  - probably
  - likely
  - unlikely
  - maybe
  - perhaps
  - possibly
  - might
  - could
  - may
  - seems
  - seem
  - appears
  - appear
  - roughly
  - approximately
  - around
  - about
  - sort of
  - kind of
  - i think
  - we think
  - i believe
  - we believe
  - i guess
  - generally
  - typically
  - usually
  - arguably
  - presumably
  - apparently
  - supposedly

