# CL-V1 in a DO (CL-I5): the verbs a DO may use. Empty in the base vocabulary, so the
# rule is skipped unless a domain supplies a list (a game world supplies its registry).
approved_verbs: []

# CL-A2. Question patterns an ASK must match. Empty in the base vocabulary.
# Each pattern is a regular expression matched against the whole ASK (case-insensitive).
ask_patterns: []

# CL-V2. Glossary: one term, one meaning, and the aliases that are forbidden.
glossary: {}
