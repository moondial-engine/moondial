# CL-R2. Relative time. Any match is an error.
relative_time:
  - next week
  - last week
  - this week
  - next month
  - last month
  - this month
  - next quarter
  - last quarter
  - this quarter
  - next year
  - last year
  - this year
  - soon
  - asap
  - as soon as possible
  - earlier
  - later
  - recently
  - tomorrow
  - yesterday
  - today
  - tonight
  - now
  - currently
  - at the moment
  - shortly
  - eventually
  - in a while
  - the other day
  - in the coming days
  - in the coming weeks
  - end of day
  - eod
  - end of week
  - eow

# CL-R2. Running periods that need "as of YYYY-MM-DD" in the same statement.
running_periods: [YTD, QTD, MTD, TTM, WTD]

# CL-V1. Discouraged word -> approved word. A match is a warning.
approved_synonyms:
  leverage: use
  leverages: use
  leveraged: used
  utilize: use
  utilizes: uses
  utilized: used
  commence: start
  commences: starts
  terminate: end
  terminates: ends
  purchase: buy
  purchases: buys
  assist: help
  assists: helps
  obtain: get
  obtains: gets
  prior to: before
  in order to: "to"
  subsequent to: after
  in the event that: if
  at this point in time: (an absolute date)
  facilitate: help
  endeavor: try
  initiate: start
  additional: more
  numerous: (a number)

