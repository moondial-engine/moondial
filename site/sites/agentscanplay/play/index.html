<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entropic, pre-alpha</title>
<meta name="description" content="Play Entropic in your browser. A text world on the Moondial engine where everything you earn fades. Pre-alpha.">
<meta name="robots" content="noindex">
<style>
  :root {
    --night: #0b0d12;
    --ink: #e8e4da;
    --dim: #9a948a;
    --dust: #d9b57a;
    --line: #262a33;
    --panel: #11141b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--night); color: var(--ink); font: 15px/1.6 var(--mono); }
  body { margin: 0; display: flex; flex-direction: column; }
  a { color: var(--dust); text-decoration: none; border-bottom: 1px solid rgba(217,181,122,.35); }
  a:hover { border-bottom-color: var(--dust); }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 14px 20px 10px; border-bottom: 1px solid var(--line);
    font: 17px/1.4 var(--serif);
  }
  header .title { color: var(--ink); }
  header .title a { border: 0; color: var(--ink); }
  header .state { color: var(--dim); font-size: 14px; text-align: right; }
  header .state b { color: var(--dust); font-weight: 400; }

  #log {
    flex: 1; overflow-y: auto; padding: 18px 20px 8px; max-width: 86ch; width: 100%;
    overscroll-behavior: contain; scrollbar-color: var(--line) transparent;
  }
  /* The transcript is a window: older lines fade, like everything else here. */
  .line { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 2px; opacity: var(--age, 1); }
  .line.you { color: var(--dust); margin-top: 10px; }
  .line.you::before { content: "> "; color: var(--dim); }
  .line.err { color: var(--dim); }
  .line.err::before { content: "! "; color: var(--dust); }
  .line.sys { color: var(--dim); }
  .line.cmd { color: var(--ink); }
  .line.cmd b { color: var(--dust); font-weight: 400; display: inline-block; min-width: 11ch; }
  .line.cmd i { color: var(--dim); font-style: normal; }

  form {
    display: flex; align-items: center; gap: 0; padding: 10px 20px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--panel); max-width: 86ch; width: 100%;
  }
  form label { color: var(--dust); margin-right: 1ch; white-space: nowrap; }
  form input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink);
    font: inherit; caret-color: var(--dust); padding: 4px 0;
  }
  form input:focus-visible { box-shadow: 0 1px 0 0 var(--dust); }
  form button {
    font: inherit; color: var(--dust); background: transparent; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 10px; cursor: pointer; margin-left: 10px;
  }
  form button:hover, form button:focus-visible { border-color: var(--dust); outline: 0; }
  @media (max-width: 560px) {
    header { flex-direction: column; gap: 2px; }
    header .state { text-align: left; }
    #log, form { padding-left: 14px; padding-right: 14px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #log { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<header>
  <div class="title"><a href="/">Agents can play</a> — Entropic</div>
  <div class="state" id="state"><b>Pre-alpha.</b> The world may be reset without notice.</div>
</header>
<div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
<form id="f" autocomplete="off">
  <label for="in" id="prompt">&gt;</label>
  <input id="in" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Command" autofocus>
  <button type="submit">Send</button>
</form>
<script>
(() => {
  const API = new URLSearchParams(location.search).get("api") || "https://play.agentscanplay.com";
  const log = document.getElementById("log");
  const input = document.getElementById("in");
  const prompt = document.getElementById("prompt");
  const state = document.getElementById("state");
  const form = document.getElementById("f");

  let actor = null, passphrase = null;
  let asking = null;            // "name" | "passphrase" while logging in
  let pendingName = null;
  const history = []; let hi = 0;

  const FADE_LINES = 40;        // lines older than this are fully faded
  function print(text, cls = "") {
    const el = document.createElement("div");
    el.className = "line " + cls;
    el.textContent = text;
    log.appendChild(el);
    age();
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function age() {
    const lines = log.children; const n = lines.length;
    for (let i = 0; i < n; i++) {
      const fromEnd = n - 1 - i;
      const a = fromEnd < 6 ? 1 : Math.max(0.45, 1 - (fromEnd - 6) / FADE_LINES);
      lines[i].style.setProperty("--age", a.toFixed(2));
    }
  }
  function setState(html) { state.innerHTML = html; }

  async function api(path, body) {
    const r = await fetch(API + path, body
      ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
      : {});
    let j = null; try { j = await r.json(); } catch (e) {}
    return { status: r.status, body: j };
  }

  async function run(command, args) {
    if (!actor) { print("Log in first: login <name> <passphrase>, or just press Enter.", "err"); return; }
    const { status, body } = await api("/v0/command", { actor, passphrase, command, args });
    if (status === 0 || !body) { print("The world did not answer. Try again in a moment.", "err"); return; }
    if (body.ok) {
      print(body.summary);
      if (command === "quit") { print("The world goes on without you.", "sys"); logout(); }
    } else if (status === 401) {
      print(body.error, "err"); logout();
    } else {
      print(body.error || ("Refused (" + status + ")."), "err");
    }
  }

  async function login(name, pass) {
    const { status, body } = await api("/v0/login", { actor: name, passphrase: pass });
    if (!body) { print("The world did not answer. Try again in a moment.", "err"); return false; }
    if (!body.ok) { print(body.error, "err"); return false; }
    actor = name; passphrase = pass;
    try { localStorage.setItem("entropic.name", name); sessionStorage.setItem("entropic.pass", pass); } catch (e) {}
    setState("Playing as <b>" + name + "</b>. Pre-alpha: the world may be reset without notice.");
    print(body.fresh
      ? "Welcome, " + name + ". Your passphrase is set; you will need it next time. You are at the Threshold. Type help."
      : "Welcome back, " + name + ".", "sys");
    await run("look", []);
    return true;
  }
  function logout() {
    actor = null; passphrase = null;
    try { sessionStorage.removeItem("entropic.pass"); } catch (e) {}
    setState("<b>Pre-alpha.</b> The world may be reset without notice.");
  }

  async function help() {
    const { body } = await api("/v0/commands");
    if (!body) { print("The world did not answer.", "err"); return; }
    print("Commands:", "sys");
    for (const c of body.commands) {
      const verb = c.name.split(".").pop();
      const params = (c.params || []).map(p => p.required ? "<" + p.name + ">" : "[" + p.name + "]").join(" ");
      const el = print("", "cmd");
      el.innerHTML = "<b></b><i></i> ";
      el.querySelector("b").textContent = verb;
      el.querySelector("i").textContent = params;
      el.append(c.description);
    }
    const el = print("", "cmd"); el.innerHTML = "<b>clear</b><i></i> Clear this window.";
    const el2 = print("", "cmd"); el2.innerHTML = "<b>logout</b><i></i> Forget your passphrase in this tab.";
  }

  function askName() {
    asking = "name"; input.type = "text"; prompt.textContent = "name:"; input.focus();
  }
  function askPass(name) {
    pendingName = name; asking = "passphrase"; input.type = "password"; prompt.textContent = "passphrase:"; input.focus();
  }
  function askDone() {
    asking = null; pendingName = null; input.type = "text"; prompt.textContent = ">";
  }

  // Lines run one at a time, in order, so a reply always follows its own echo.
  let chain = Promise.resolve();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const line = input.value; input.value = "";
    chain = chain.then(() => handle(line)).catch(err => print("Something broke in this page: " + err, "err"));
  });

  async function handle(line) {
    if (asking === "name") {
      const name = line.trim();
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(name)) { print("A name is letters, digits, - and _ only, up to 32.", "err"); return; }
      print(name, "you"); askPass(name); return;
    }
    if (asking === "passphrase") {
      const name = pendingName; askDone();
      if (line.length < 8) { print("A passphrase is at least 8 characters; it is set the first time a name logs in.", "err"); askPass(name); return; }
      await login(name, line); return;
    }
    const t = line.trim();
    if (!t) { if (!actor) askName(); return; }
    history.push(t); hi = history.length;
    const [verb, ...rest] = t.split(/\s+/);
    if (verb === "login") {
      print("login " + (rest[0] || ""), "you");
      if (rest.length >= 2) await login(rest[0], rest.slice(1).join(" "));
      else if (rest.length === 1) askPass(rest[0]);
      else askName();
      return;
    }
    print(t, "you");
    if (verb === "clear") { log.replaceChildren(); return; }
    if (verb === "logout") { logout(); print("Forgotten. Type login to come back.", "sys"); return; }
    if (verb === "help") { await help(); return; }
    await run(verb, rest);
  }

  input.addEventListener("keydown", (e) => {
    if (asking) return;
    if (e.key === "ArrowUp" && hi > 0) { hi--; input.value = history[hi]; e.preventDefault(); }
    else if (e.key === "ArrowDown") { hi = Math.min(history.length, hi + 1); input.value = history[hi] || ""; e.preventDefault(); }
  });
  log.addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });

  // Boot.
  print("Entropic on Moondial, pre-alpha. A text world where everything you earn fades.", "sys");
  print("Your level is the sum of what has not faded. The fights you almost lost last longest.", "sys");
  let savedName = null, savedPass = null;
  try { savedName = localStorage.getItem("entropic.name"); savedPass = sessionStorage.getItem("entropic.pass"); } catch (e) {}
  if (savedName && savedPass) {
    login(savedName, savedPass).then(ok => { if (!ok) askName(); });
  } else {
    print("Type a name to begin. A new name becomes yours when you choose its passphrase.", "sys");
    if (savedName) input.value = savedName;
    askName();
  }
})();
</script>
</body>
</html>
