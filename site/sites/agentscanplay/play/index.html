<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entropic, pre-alpha</title>
<meta name="description" content="Play Entropic in your browser. A text world on the Moondial engine where everything you earn fades. Pre-alpha.">
<meta name="robots" content="noindex">
<style>
  :root {
    --night: #0b0d12;
    --ink: #e8e4da;
    --dim: #9a948a;
    --dust: #d9b57a;
    --line: #262a33;
    --panel: #11141b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--night); color: var(--ink); font: 15px/1.6 var(--mono); }
  body { margin: 0; display: flex; flex-direction: column; }
  a { color: var(--dust); text-decoration: none; border-bottom: 1px solid rgba(217,181,122,.35); }
  a:hover { border-bottom-color: var(--dust); }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 14px 20px 10px; border-bottom: 1px solid var(--line);
    font: 17px/1.4 var(--serif);
  }
  header .title { color: var(--ink); }
  header .title a { border: 0; color: var(--ink); }
  header .state { color: var(--dim); font-size: 14px; text-align: right; }
  header .state b { color: var(--dust); font-weight: 400; }

  #main { flex: 1; display: flex; min-height: 0; }
  #term { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 18px 20px 8px; max-width: 86ch; width: 100%;
    overscroll-behavior: contain; scrollbar-color: var(--line) transparent;
  }
  /* The transcript is a window: older lines fade, like everything else here. */
  .line { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 2px; opacity: var(--age, 1); }
  .line.you { color: var(--dust); margin-top: 10px; }
  .line.you::before { content: "> "; color: var(--dim); }
  .line.err { color: var(--dim); }
  .line.err::before { content: "! "; color: var(--dust); }
  .line.sys { color: var(--dim); }
  .line.tell { color: var(--ink); }
  .line.tell::before { content: "* "; color: var(--dust); }
  .line.cmd { color: var(--ink); }
  .line.cmd b { color: var(--dust); font-weight: 400; display: inline-block; min-width: 11ch; }
  .line.cmd i { color: var(--dim); font-style: normal; }

  form {
    display: flex; align-items: center; gap: 0; padding: 10px 20px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--panel); max-width: 86ch; width: 100%;
  }
  form label { color: var(--dust); margin-right: 1ch; white-space: nowrap; }
  form input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink);
    font: inherit; caret-color: var(--dust); padding: 4px 0;
  }
  form input:focus-visible { box-shadow: 0 1px 0 0 var(--dust); }
  form button {
    font: inherit; color: var(--dust); background: transparent; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 10px; cursor: pointer; margin-left: 10px;
  }
  form button:hover, form button:focus-visible { border-color: var(--dust); outline: 0; }

  /* The scene: what the world looks like, drawn from subscriptions. Timed values are
     evaluated here from their curves, every frame; the server is never asked twice. */
  #scene {
    width: 340px; border-left: 1px solid var(--line); background: var(--panel);
    padding: 16px 18px; overflow-y: auto; font-size: 13px; line-height: 1.5; display: none;
  }
  @media (min-width: 900px) { #scene { display: block; } }
  #scene h2 { font: 15px/1.3 var(--serif); color: var(--dim); margin: 14px 0 8px; font-weight: 400; }
  #scene h2:first-child { margin-top: 0; }
  #map { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 62px); gap: 6px; }
  .tile { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--dim); overflow: hidden; }
  .tile.here { color: var(--ink); border-color: var(--dust); }
  .tile .dir { font-size: 11px; color: var(--dim); }
  .tile .nm { font-size: 12px; line-height: 1.25; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
  .glyph { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; font-weight: 700; background: var(--night); border: 1px solid var(--line); flex: none; }
  .row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--night); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; width: 90px; flex: none; }
  .bar i { display: block; height: 100%; background: var(--dust); width: 0; }
  .bar.hp i { background: #c96a6a; }
  .num { color: var(--dim); font-size: 12px; width: 7ch; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .empty { color: var(--dim); }
  #link { color: var(--dim); font-size: 12px; margin-top: 16px; }
  @media (max-width: 560px) {
    header { flex-direction: column; gap: 2px; }
    header .state { text-align: left; }
    #log, form { padding-left: 14px; padding-right: 14px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #log { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<header>
  <div class="title"><a href="/">Agents can play</a> — Entropic</div>
  <div class="state" id="state"><b>Pre-alpha.</b> The world may be reset without notice.</div>
</header>
<div id="main">
  <div id="term">
    <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
    <form id="f" autocomplete="off">
      <label for="in" id="prompt">&gt;</label>
      <input id="in" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Command" autofocus>
      <button type="submit">Send</button>
    </form>
  </div>
  <aside id="scene" aria-label="The scene">
    <h2>Where</h2>
    <div id="map"></div>
    <h2>Here</h2>
    <div id="here"><div class="empty">Log in to see the room.</div></div>
    <h2>You</h2>
    <div id="you"></div>
    <h2>Your window</h2>
    <div id="window"></div>
    <div id="link"></div>
  </aside>
</div>
<script>
(() => {
  const API = new URLSearchParams(location.search).get("api") || "https://play.agentscanplay.com";
  const WS = API.replace(/^http/, "ws") + "/v0/session";
  const log = document.getElementById("log");
  const input = document.getElementById("in");
  const prompt = document.getElementById("prompt");
  const state = document.getElementById("state");
  const form = document.getElementById("f");
  const $ = (id) => document.getElementById(id);

  let actor = null, passphrase = null;
  let asking = null, pendingName = null;
  const history = []; let hi = 0;

  // ---- transcript ----
  const FADE_LINES = 40;
  function print(text, cls = "") {
    const el = document.createElement("div");
    el.className = "line " + cls;
    el.textContent = text;
    log.appendChild(el);
    age();
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function age() {
    const lines = log.children; const n = lines.length;
    for (let i = 0; i < n; i++) {
      const fromEnd = n - 1 - i;
      const a = fromEnd < 6 ? 1 : Math.max(0.45, 1 - (fromEnd - 6) / FADE_LINES);
      lines[i].style.setProperty("--age", a.toFixed(2));
    }
  }
  function setState(html) { state.innerHTML = html; }

  // ---- HTTP, for login and as the fallback when the session cannot open ----
  async function api(path, body) {
    const r = await fetch(API + path, body
      ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
      : {});
    let j = null; try { j = await r.json(); } catch (e) {}
    return { status: r.status, body: j };
  }

  // ---- the session: one socket, commands and pushes ----
  let ws = null, wsReady = false, nextId = 1;
  const waiting = new Map();           // id -> resolve
  const subs = {};                     // id -> last observation
  let skew = 0;                        // Date.now() - server as_of, from the last observation
  let cursor = 0, polling = null;

  function connect() {
    return new Promise((resolve) => {
      let settled = false;
      try { ws = new WebSocket(WS); } catch (e) { resolve(false); return; }
      ws.onopen = () => { ws.send(JSON.stringify({ type: "login", actor, passphrase })); };
      ws.onmessage = (m) => {
        let f; try { f = JSON.parse(m.data); } catch (e) { return; }
        if (f.type === "welcome") {
          wsReady = true; cursor = f.cursor; settled = true; resolve(true);
          subscribe("room", { root: "here", select: { "entropic.room": ["name"], "entropic.sprite": "*" }, relations: {
            contents: { kinds: ["citizen", "creature"], select: { "entropic.citizen": ["name"], "entropic.creature": ["name", "hp", "max_hp"], "entropic.sprite": "*" } },
            exits: { select: { "entropic.room": ["name"], "entropic.sprite": "*" } } }, timed: "curve", commands: false });
          subscribe("me", { root: "self", select: { "entropic.body": ["hp", "max_hp"], "entropic.sprite": "*" }, timed: "curve", commands: false });
          subscribe("window", { root: "window", select: {}, relations: { contents: { kinds: ["chunk"], select: { "entropic.chunk": "*" } } }, timed: "curve", commands: false });
          return;
        }
        if (f.type === "error" && !settled) { settled = true; print(f.error, "err"); resolve(false); return; }
        if (f.type === "result" || (f.type === "error" && f.id !== undefined && waiting.has(String(f.id)))) {
          const r = waiting.get(String(f.id)); waiting.delete(String(f.id)); if (r) r(f); return;
        }
        if (f.type === "observation") { subs[f.id] = f; skew = Date.now() - f.as_of; draw(); return; }
        if (f.type === "event") {
          const e = f.event;
          if (e.kind === "entropic.narrative" && e.payload && e.payload.to === actor) print(e.payload.text, "tell");
          return;
        }
      };
      ws.onclose = () => {
        if (wsReady) print("The session closed. Reconnecting.", "sys");
        wsReady = false;
        if (!settled) { settled = true; resolve(false); }
        else if (actor) setTimeout(() => { connect().then(ok => { if (!ok) startPolling(); }); }, 3000);
      };
      ws.onerror = () => {};
    });
  }
  function subscribe(id, query) { if (wsReady) ws.send(JSON.stringify({ type: "subscribe", id, query })); }
  setInterval(() => { if (wsReady) { try { ws.send(JSON.stringify({ type: "ping" })); } catch (e) {} } }, 30000);
  function wsCommand(command, args) {
    return new Promise((resolve) => {
      const id = String(nextId++);
      waiting.set(id, resolve);
      ws.send(JSON.stringify({ type: "command", id, command, args }));
      setTimeout(() => { if (waiting.has(id)) { waiting.delete(id); resolve({ ok: false, error: "The world did not answer. Try again in a moment." }); } }, 15000);
    });
  }

  // ---- polling, only when the session cannot open ----
  async function poll() {
    if (!actor || wsReady) return;
    try {
      const { status, body } = await api("/v0/observe", { actor, passphrase, query: { root: "self", select: {}, commands: false, after: cursor } });
      if (status === 401) { print(body.error, "err"); logout(); return; }
      if (!body || !body.ok) return;
      for (const e of body.observation.events || []) {
        if (e.kind === "entropic.narrative" && e.payload && e.payload.to === actor) print(e.payload.text, "tell");
      }
      cursor = body.observation.cursor;
    } catch (e) {}
  }
  function startPolling() { stopPolling(); polling = setInterval(poll, 5000); $("link").textContent = "No live session; polling every 5 s."; }
  function stopPolling() { if (polling) { clearInterval(polling); polling = null; } }

  // ---- commands ----
  async function run(command, args) {
    if (!actor) { print("Log in first: login <name> <passphrase>, or just press Enter.", "err"); return; }
    let body;
    if (wsReady) {
      body = await wsCommand(command, args);
    } else {
      const r = await api("/v0/command", { actor, passphrase, command, args });
      if (r.status === 401) { print(r.body.error, "err"); logout(); return; }
      body = r.body || { ok: false, error: "The world did not answer. Try again in a moment." };
      await poll();
    }
    if (body.ok) {
      print(body.summary);
      if (command === "quit") { print("The world goes on without you.", "sys"); logout(); }
    } else {
      print(body.error || "Refused.", "err");
    }
  }

  async function login(name, pass) {
    const { status, body } = await api("/v0/login", { actor: name, passphrase: pass });
    if (!body) { print("The world did not answer. Try again in a moment.", "err"); return false; }
    if (!body.ok) { print(body.error, "err"); return false; }
    actor = name; passphrase = pass;
    try { localStorage.setItem("entropic.name", name); sessionStorage.setItem("entropic.pass", pass); } catch (e) {}
    setState("Playing as <b>" + name + "</b>. Pre-alpha: the world may be reset without notice.");
    print(body.fresh
      ? "Welcome, " + name + ". Your passphrase is set; you will need it next time. You are at the Threshold. Type help."
      : "Welcome back, " + name + ".", "sys");
    const live = await connect();
    if (live) { $("link").textContent = "Live session."; } else { try { const h = await api("/health"); if (h.body) cursor = h.body.events || 0; } catch (e) {} startPolling(); }
    await run("look", []);
    return true;
  }
  function logout() {
    stopPolling();
    if (ws) { const w = ws; ws = null; wsReady = false; try { w.onclose = null; w.close(); } catch (e) {} }
    actor = null; passphrase = null;
    for (const k in subs) delete subs[k];
    draw();
    try { sessionStorage.removeItem("entropic.pass"); } catch (e) {}
    setState("<b>Pre-alpha.</b> The world may be reset without notice.");
    $("link").textContent = "";
  }

  async function help() {
    const { body } = await api("/v0/commands");
    if (!body) { print("The world did not answer.", "err"); return; }
    print("Commands:", "sys");
    for (const c of body.commands) {
      const verb = c.name.split(".").pop();
      const params = (c.params || []).map(p => p.required ? "<" + p.name + ">" : "[" + p.name + "]").join(" ");
      const el = print("", "cmd");
      el.innerHTML = "<b></b><i></i> ";
      el.querySelector("b").textContent = verb;
      el.querySelector("i").textContent = params;
      el.append(c.description);
    }
    const el = print("", "cmd"); el.innerHTML = "<b>clear</b><i></i> Clear this window.";
    const el2 = print("", "cmd"); el2.innerHTML = "<b>logout</b><i></i> Forget your passphrase in this tab.";
  }

  // ---- the scene ----
  // A timed value arrives as {value, waterline, curve, bounds, paused}; this evaluates it
  // at the client's clock, corrected by the skew measured on the last observation.
  function timed(t) {
    if (typeof t === "number") return t;
    if (!t || typeof t !== "object") return 0;
    if (t.paused) return t.value;
    const now = Date.now() - skew;
    const dt = Math.max(0, now - t.waterline.at), v0 = t.waterline.value, c = t.curve;
    let v;
    if (c === "Constant") v = v0;
    else if (c.Linear) v = v0 + c.Linear.rate_per_ms * dt;
    else if (c.Exponential) v = v0 * Math.pow(0.5, dt / c.Exponential.half_life);
    else if (c.PowerLaw) v = v0 / Math.pow(1 + dt / c.PowerLaw.scale, c.PowerLaw.exponent);
    else if (c.Step) v = v0 + Math.floor(dt / c.Step.interval) * c.Step.delta;
    else v = t.value;
    const b = t.bounds || {};
    if (b.floor != null) v = Math.max(b.floor, v);
    if (b.ceiling != null) v = Math.min(b.ceiling, v);
    return v;
  }
  const DIRS = { north: [1, 0], south: [1, 2], west: [0, 1], east: [2, 1] };
  function tile(name, dir, here, tint) {
    const d = document.createElement("div");
    d.className = "tile" + (here ? " here" : "");
    if (tint) d.style.borderLeft = "3px solid " + tint;
    d.innerHTML = '<div class="dir"></div><div class="nm"></div>';
    d.querySelector(".dir").textContent = dir;
    d.querySelector(".nm").textContent = name.replace(/^The /, "");
    return d;
  }
  function row(glyph, tint, name, barClass, frac, num) {
    const r = document.createElement("div"); r.className = "row";
    const g = document.createElement("div"); g.className = "glyph"; g.textContent = glyph; g.style.color = tint || "var(--ink)";
    const n = document.createElement("div"); n.className = "nm"; n.textContent = name;
    r.append(g, n);
    if (barClass) {
      const b = document.createElement("div"); b.className = "bar " + barClass; const i = document.createElement("i"); b.append(i); r.append(b);
      i.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + "%";
    }
    if (num != null) { const m = document.createElement("div"); m.className = "num"; m.textContent = num; r.append(m); }
    return r;
  }
  function draw() {
    const map = $("map"), here = $("here"), you = $("you"), win = $("window");
    map.replaceChildren(); here.replaceChildren(); you.replaceChildren(); win.replaceChildren();
    const room = subs.room && subs.room.root;
    if (!room) { here.innerHTML = '<div class="empty">Log in to see the room.</div>'; return; }
    const cells = Array.from({ length: 9 }, () => null);
    const sprite = (n) => (n.components && n.components["entropic.sprite"]) || {};
    cells[4] = tile(room.components["entropic.room"].name, "here", true, sprite(room).tint);
    for (const ex of (room.relations && room.relations.exits) || []) {
      const d = DIRS[ex.via]; if (!d) continue;
      cells[d[1] * 3 + d[0]] = tile(ex.components["entropic.room"].name, ex.via, false, sprite(ex).tint);
    }
    for (const c of cells) map.append(c || Object.assign(document.createElement("div"), { className: "tile", style: "border-color: transparent" }));
    const things = (room.relations && room.relations.contents) || [];
    if (!things.length) here.innerHTML = '<div class="empty">Nothing here.</div>';
    for (const n of things) {
      const s = sprite(n);
      if (n.kind === "creature") {
        const c = n.components["entropic.creature"];
        here.append(row(s.glyph || "?", s.tint, c.name, "hp", c.hp / c.max_hp, c.hp + "/" + c.max_hp));
      } else {
        const nm = n.components["entropic.citizen"] ? n.components["entropic.citizen"].name : "?";
        here.append(row(s.glyph || "@", nm === actor ? "var(--dust)" : s.tint, nm === actor ? nm + " (you)" : nm));
      }
    }
    const me = subs.me && subs.me.root;
    if (me && me.components["entropic.body"]) {
      const b = me.components["entropic.body"];
      const hp = timed(b.hp), max = b.max_hp;
      you.append(row("@", "var(--dust)", "hit points", "hp", hp / max, hp.toFixed(1) + "/" + max));
    }
    const chunks = (subs.window && subs.window.root.relations && subs.window.root.relations.contents) || [];
    if (!chunks.length) win.innerHTML = '<div class="empty">Nothing remembered yet.</div>';
    let level = 0;
    for (const n of chunks) {
      const c = n.components["entropic.chunk"]; const v = timed(c.value); level += v;
      win.append(row("·", "var(--dust)", c.source + "  v" + (c.vividity || 0).toFixed(2), "", v / c.size, v.toFixed(2)));
    }
    if (chunks.length) win.append(Object.assign(document.createElement("div"), { className: "empty", textContent: "Level " + level.toFixed(2) }));
  }
  // Timed values move between pushes; redraw a few times a second while the scene shows.
  setInterval(() => { if (actor && $("scene").offsetParent !== null && (subs.me || subs.window)) draw(); }, 250);

  // ---- input ----
  function askName() { asking = "name"; input.type = "text"; prompt.textContent = "name:"; input.focus(); }
  function askPass(name) { pendingName = name; asking = "passphrase"; input.type = "password"; prompt.textContent = "passphrase:"; input.focus(); }
  function askDone() { asking = null; pendingName = null; input.type = "text"; prompt.textContent = ">"; }

  let chain = Promise.resolve();
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const line = input.value; input.value = "";
    chain = chain.then(() => handle(line)).catch(err => print("Something broke in this page: " + err, "err"));
  });

  async function handle(line) {
    if (asking === "name") {
      const name = line.trim();
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(name)) { print("A name is letters, digits, - and _ only, up to 32.", "err"); return; }
      print(name, "you"); askPass(name); return;
    }
    if (asking === "passphrase") {
      const name = pendingName; askDone();
      if (line.length < 8) { print("A passphrase is at least 8 characters; it is set the first time a name logs in.", "err"); askPass(name); return; }
      await login(name, line); return;
    }
    const t = line.trim();
    if (!t) { if (!actor) askName(); return; }
    history.push(t); hi = history.length;
    const [verb, ...rest] = t.split(/\s+/);
    if (verb === "login") {
      print("login " + (rest[0] || ""), "you");
      if (rest.length >= 2) await login(rest[0], rest.slice(1).join(" "));
      else if (rest.length === 1) askPass(rest[0]);
      else askName();
      return;
    }
    print(t, "you");
    if (verb === "clear") { log.replaceChildren(); return; }
    if (verb === "logout") { logout(); print("Forgotten. Type login to come back.", "sys"); return; }
    if (verb === "help") { await help(); return; }
    await run(verb, rest);
  }

  input.addEventListener("keydown", (e) => {
    if (asking) return;
    if (e.key === "ArrowUp" && hi > 0) { hi--; input.value = history[hi]; e.preventDefault(); }
    else if (e.key === "ArrowDown") { hi = Math.min(history.length, hi + 1); input.value = history[hi] || ""; e.preventDefault(); }
  });
  log.addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });

  // ---- boot ----
  print("Entropic on Moondial, pre-alpha. A text world where everything you earn fades.", "sys");
  print("Your level is the sum of what has not faded. The fights you almost lost last longest.", "sys");
  let savedName = null, savedPass = null;
  try { savedName = localStorage.getItem("entropic.name"); savedPass = sessionStorage.getItem("entropic.pass"); } catch (e) {}
  if (savedName && savedPass) {
    login(savedName, savedPass).then(ok => { if (!ok) askName(); });
  } else {
    print("Type a name to begin. A new name becomes yours when you choose its passphrase.", "sys");
    if (savedName) input.value = savedName;
    askName();
  }
})();
</script>
</body>
</html>
